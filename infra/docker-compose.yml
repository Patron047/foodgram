services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/

  frontend:
    build: ../frontend
    # Volume убран, так как мы используем docker cp для надежности на Windows
    # Если хочешь попробовать volume снова, раскомментируй, но помни про проблему синхронизации
    # volumes:
    #   - ../frontend_static:/app/result_build/

  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
      # Порт 443 можно убрать для локалки, если нет SSL
      # - "443:443" 
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf  # <-- ИСПОЛЬЗУЕМ ЛОКАЛЬНЫЙ КОНФИГ
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_value:/django_static/
      - media_value:/media/
      # Certbot volumes можно убрать для локалки, если не тестируем HTTPS
      # - certbot_www:/var/www/certbot
      # - certbot_conf:/etc/letsencrypt
      - ../frontend_static:/usr/share/nginx/html  # <-- Файлы фронтенда, которые мы копируем через docker cp
    depends_on:
      - backend

  # Certbot можно закомментировать для локальной разработки, чтобы не мешал
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - certbot_conf:/etc/letsencrypt
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  static_value:
  media_value:
  # certbot_www:
  # certbot_conf: